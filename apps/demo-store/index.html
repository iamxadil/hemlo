<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Nafha · نفحة — Hemlo Studio demo store</title>
    <meta name="description" content="A live demo online store and its control panel, by Hemlo Studio. Change anything in the panel and watch the store update." />
    <meta name="theme-color" content="#F6F3EE" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // before the first paint: language and direction (so nothing jumps), the Arabic font when it's needed,
      // and — on the home page only — the hero photograph at the size this screen will use
      (function () {
        var d = document, h = d.documentElement, l;
        try { var q = new URLSearchParams(location.search).get('lang'); l = q === 'ar' || q === 'en' ? q : localStorage.getItem('hemlo-demo-lang') || (navigator.language.toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en'); } catch (e) { l = 'ar'; }
        h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
        var add = function (a) { var k = d.createElement('link'); for (var x in a) k.setAttribute(x, a[x]); d.head.appendChild(k); };
        if (l === 'ar') add({ rel: 'preload', href: '/fonts/vazirmatn-arabic.woff2', as: 'font', type: 'font/woff2', crossorigin: '' });
        if (location.pathname === '/') {
          var set = function (k) { return [640, 960, 1400, 2000, 2800].map(function (w) { return '/photos/' + k + '-' + w + '.avif ' + w + 'w'; }).join(', '); };
          add({ rel: 'preload', as: 'image', type: 'image/avif', imagesrcset: set('ritual'), imagesizes: '100vw', media: '(min-width: 721px)', fetchpriority: 'high' });
          add({ rel: 'preload', as: 'image', type: 'image/avif', imagesrcset: set('ritual-tall'), imagesizes: '100vw', media: '(max-width: 720px)', fetchpriority: 'high' });
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"><div class="boot" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
